server.port=8081
spring.application.name=employee-payroll-system

# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payroll_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:225494585138}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== SQL INIT (schema.sql / data.sql) =====
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:ThisIsASecretKeyForPayrollSystemThatMustBeAtLeast256BitsLong123456}
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000

# ===== SWAGGER =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== MAIL (used for forgot-password emails; configure real SMTP in prod) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== LOGGING =====
logging.level.org.springframework.security=INFO
logging.level.com.payroll=DEBUG

# ===== FILE UPLOAD (payslip PDFs) =====
app.payslip.output-dir=./payslips
